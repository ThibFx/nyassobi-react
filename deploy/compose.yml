# Site Nyassobi sur la Raspberry Pi, à côté de l'observatoire (8501) :
# http://nv-pi:8503, ou http://nv-pi:8503 par Tailscale.
services:
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8503:80"
    volumes:
      - ./www:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
