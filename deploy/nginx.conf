# Serveur du site sur la Raspberry Pi.
#
# /srv/current est un lien vers la dernière version envoyée : le déploiement
# bascule ce lien d'un coup, sans moment où le site serait à moitié copié.
server {
    listen 80;
    root /srv/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers de /assets portent une empreinte dans leur nom : un fichier
    # modifié change de nom, on peut donc les garder en cache très longtemps.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Toutes les autres adresses sont des pages de l'application React :
    # index.html est toujours revalidé pour qu'une nouvelle version se voie
    # dès le rechargement.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
